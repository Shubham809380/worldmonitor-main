<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldGuard — Real-Time Global Threat Intelligence</title>
    <meta
      name="description"
      content="WorldGuard fuses global signals into one continuous picture of security risk. Monitor threats, infrastructure exposure, and policy shifts as they happen."
    />
    <meta name="theme-color" content="#04070d" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://www.worldmonitor.app/worldguard" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WorldGuard" />
    <meta property="og:title" content="WorldGuard — Real-Time Global Threat Intelligence" />
    <meta
      property="og:description"
      content="WorldGuard fuses global signals into one continuous picture of security risk."
    />
    <meta property="og:url" content="https://www.worldmonitor.app/worldguard" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Critical shell styles only. The full WorldGuard design system is
         bundled by src/worldguard-main.ts and swaps in on boot. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      html {
        background: #050a05;
        color-scheme: dark;
      }
      body {
        min-height: 100dvh;
        background: #050a05;
        color: #e8f5e9;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      #wg-root {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      .wg-boot {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1;
        gap: 0.75rem;
        font-size: 0.8125rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(34, 197, 94, 0.5);
      }
      .wg-boot__pulse {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6);
        animation: wg-boot-pulse 1.6s ease-out infinite;
      }
      @keyframes wg-boot-pulse {
        70% {
          box-shadow: 0 0 0 0.6rem rgba(34, 197, 94, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .wg-boot__pulse {
          animation: none;
        }
      }
      .wg-boot__fallback {
        display: none;
        max-width: 32rem;
        text-align: center;
        line-height: 1.6;
        color: rgba(232, 245, 233, 0.5);
      }
      .wg-boot--failed .wg-boot {
        display: none;
      }
      .wg-boot--failed .wg-boot__fallback {
        display: block;
      }
    </style>
    <!-- No inline scripts: the global Content-Security-Policy at
         vercel.json:545 is nonce-based with 'strict-dynamic', and this entry
         opts into the shared `wm-static-bootstrap` nonce rather than adding
         page-specific script hashes. All behaviour is in the bundled module
         at src/worldguard-main.ts. -->
  </head>
  <body>
    <div id="wg-root">
      <div class="wg-boot" id="wg-boot" role="status" aria-live="polite">
        <span class="wg-boot__pulse" aria-hidden="true"></span>
        <span>Initialising WorldGuard</span>
      </div>
      <p class="wg-boot__fallback" id="wg-boot-fallback">
        WorldGuard could not start because its module bundle failed to load. This
        usually means a content-security or network policy blocked the script.
        <a href="/dashboard">Open the World Monitor dashboard</a> or retry the page.
      </p>
    </div>
    <noscript>
      <div
        style="
          max-width: 34rem;
          margin: 0 auto;
          padding: 3rem 1.5rem;
          font-family: system-ui, sans-serif;
          color: #e6edf6;
          line-height: 1.6;
        "
      >
        <h1 style="font-size: 1.25rem; margin-bottom: 0.75rem">WorldGuard requires JavaScript</h1>
        <p style="color: #8b9bb0; margin: 0">
          WorldGuard renders live threat telemetry in the browser and cannot run with
          JavaScript disabled. The underlying intelligence is also available through
          the
          <a href="/dashboard">World Monitor dashboard</a> and the public API.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/worldguard-main.ts" nonce="wm-static-bootstrap"></script>
  </body>
</html>
